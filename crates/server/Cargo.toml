[package]
name = "chesscrab-server"
description = "ChessCrab senkronizasyon sunucusu (motor/analiz istemcide çalışır)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "chesscrab-server"
path = "src/main.rs"

[dependencies]
chesscrab-sync.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
thiserror.workspace = true
axum = "0.8.9"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7", features = ["cors", "trace", "fs", "set-header"] }
argon2 = "0.6"
getrandom = "0.4.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
