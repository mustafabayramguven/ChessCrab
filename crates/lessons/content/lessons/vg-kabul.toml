[[steps]]
text = "Ders: VG'de c4 piyonu çoğu zaman kendiliğinden düşer. Siyah onu tutmaya çalışırsa vezir kanadını zayıflatır. Doğru VGK'de siyah piyonu geri verir ve ...e6, ...c5, ...Nf6 ile gelişir."

