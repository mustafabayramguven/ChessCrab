[[steps]]
text = "Son öğüt: plan bir hikâyedir, ezber değil. Bir açılışı oynadığında o açılışın tipik yapısını ve planlarını bil; hamleler buradan doğar. Oyunlarını ChessCrab'ın analizinde incele, 'Hata' ve 'Kaçırılan' anlarda hangi planın doğru olduğunu düşün."
