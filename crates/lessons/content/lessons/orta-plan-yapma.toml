id = "orta-plan-yapma"
title = "Plan nasıl yapılır?"
summary = "Dengesizlikleri say, hedef seç, en kötü taşını iyileştir."
level = "orta"
tags = ["orta oyun", "plan"]

[[steps]]
text = "Açılış bitti, sıra planda. Basit bir yöntem: pozisyondaki DENGESİZLİKLERİ listele. 1) Materyal, 2) Piyon yapısı (zayıf piyonlar, geçer piyon, zayıf kareler), 3) Şah güvenliği, 4) Taş aktivitesi ve fil-at farkı, 5) Alan ve açık hatlar, 6) Gelişim/inisiyatif."

[[steps]]
text = "Sonra: kendi avantajlarını büyüten, rakibin avantajlarını azaltan bir hedef seç. Hedef yoksa 'en kötü taşını iyileştir' kuralını uygula. Ve her hamlede önce rakibin tehdidine bak!"

