quiz = { question = "Siyah kötü c8 filini nasıl iyileştirebilir?", options = ["...Bd7-e8-h5 ya da ...b6/...Ba6 ile değiştirmek veya ...f6 ile zinciri açmak", "Hiçbir şey yapamaz", "...g5 ile"], answer = 0 }

