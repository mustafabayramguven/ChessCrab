id = "temel-tas-degerleri"
title = "Taşların değeri"
summary = "Piyon 1, at 3, fil 3, kale 5, vezir 9: hangi alım daha iyi?"
level = "baslangic"
tags = ["temel"]

[[steps]]
text = "Yaklaşık değerler: piyon 1, at 3, fil 3, kale 5, vezir 9. Şah paha biçilemez. Bu değerler değişimin iyi mi kötü mü olduğunu hesaplamana yardım eder."

[[steps]]
fen = "7k/8/8/1p1r4/n7/8/8/3QK3 w - - 0 1"
text = "Vezirin hem d5'teki kaleyi hem a4'teki atı alabilir. Hangisi? Dikkat: a4'teki at b5 piyonu tarafından korunuyor."
expect = "Qxd5"
success = "Doğru! Korunmayan kaleyi (5) aldın. Qxa4 olsaydı bxa4 ile veziri (9) kaybederdin."
wrong = "Korunan bir taşı vezirle almak veziri kaybettirir. Korunmayan ve daha değerli taşı bul."

[[steps]]
fen = "4k3/8/2n5/8/8/8/2Q3r1/4K3 w - - 0 1"
text = "Bazen daha az değerli taşı almak daha iyidir: c6'daki atı şah çekerek al. Sonra ne olacak?"
expect = "Qxc6+"
reply = "Kf8"
success = "Vezir c6'dan hem şaha hem g2'deki kaleye bakıyor: bu bir ÇATAL."

[[steps]]
text = "Şimdi kaleyi de al."
expect = "Qxg2"
success = "İki taşı birden kazandın. Değerleri bilmek iyi, ama tehditleri görmek daha iyi!"

[[steps]]
quiz = { question = "Bir kaleni rakibin atına verirsen (kalite kaybı) kabaca kaç puan kaybedersin?", options = ["0", "1", "2", "4"], answer = 2, explain = "Kale 5, at 3: 2 puan. Buna 'kalite' denir." }
