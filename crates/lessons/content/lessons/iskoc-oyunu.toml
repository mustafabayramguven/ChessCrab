text = "Açmazı kır: vezirle koru."

[[steps]]
text = "Atı merkezden kov."
expect = "c4"
reply = "Ba6"
success = "Mieses Varyantı. Siyah ...Ba6 ile c4 piyonunu vezire karşı açmaza aldı. Beyazın kozu e5 piyonunun verdiği alan; siyahın kozu aktif taşlar ve beyazın gelişim gecikmesi. Ana hat: 9.b3."

