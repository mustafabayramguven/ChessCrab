puzzle = true
success = "ÇİFTE ŞAH! Hem fil hem at şah çekiyor: tek kurtuluş şahı oynatmak. Atı almak (gxf6) yasal değil, çünkü fil hâlâ şah çekiyor."

[[steps]]
expect = "Nxd7"
text = "Veziri al."

