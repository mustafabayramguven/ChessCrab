[[steps]]
text = "Açarak saldırı: bir taş oynar ve arkasındaki uzun menzilli taşın hattı açılır. Oynayan taş da tehdit yaparsa rakip iki tehdide birden cevap vermek zorunda kalır. Açılan hat şah çekiyorsa 'açarak şah', iki taş birden şah çekiyorsa 'çifte şah'."

[[steps]]
fen = "8/3q2pk/8/8/4N3/8/8/1B4K1 w - - 0 1"
text = "b1 filinin önünde e4 atı var ve hat h7'deki şaha gidiyor. Atı öyle bir yere oynat ki hem şah çeksin hem vezire saldırsın."
