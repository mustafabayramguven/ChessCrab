id = "orta-acik-hat"
title = "Açık hat ve 7. yatay"
summary = "Kaleler açık hatlara, oradan 7. yataya: piyon yiyici domuzlar."
level = "orta"
tags = ["orta oyun", "kale"]

[[steps]]
text = "Kaleler açık hatlarda (üzerinde piyon olmayan dikeyler) güçlenir. Hedef: hattı ele geçir, sonra rakip piyonların başlangıç yatayına (beyaz için 7. yatay) gir. 7. yataydaki kale piyonlara saldırır ve şahı arka yatayda kilitler."

[[steps]]
fen = "1r4k1/p4ppp/8/8/8/8/P4PPP/3R1RK1 w - - 0 1"
text = "d-hattı açık ve senin. 7. yataya gir!"
expect = "Rd7"
reply = "Rf8"
puzzle = true
success = "Kale a7'ye saldırıyor ve siyahı pasifleştirdi: siyah kale f7'yi ve arka yatayı korumak için f8'e çekilmek zorunda kaldı."

[[steps]]
text = "Piyon al."
expect = "Rxa7"
success = "Piyon kazandın; a-piyonu artık geçer piyon. Siyahın kalesi pasif kaldı."

[[steps]]
text = "Sonraki adım: ikinci kale de 7. yataya ya da açık hatta. İki kale 7. yatayda ise çoğu zaman mat tehditleri doğar."

