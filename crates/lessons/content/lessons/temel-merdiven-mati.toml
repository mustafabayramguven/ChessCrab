id = "temel-merdiven-mati"
title = "Merdiven matı (iki kale)"
summary = "İki kaleyle şahı tahtanın kenarına itip mat etmek."
level = "baslangic"
tags = ["temel", "mat", "son oyun"]

[[steps]]
fen = "8/8/8/8/3k4/8/1R6/R5K1 w - - 0 1"
text = "İki kale merdiven gibi çalışır: biri bir yatayı keser, diğeri bir üst yataydan şah çeker. Şah her seferinde bir basamak yukarı çıkmak zorunda kalır. İlk basamak: a1 kalesiyle 3. yatayı kes."
expect = "Ra3"
reply = "Ke4"
success = "Şah artık 3. yataya inemiyor."

[[steps]]
text = "Şimdi diğer kale 4. yataydan şah çeksin."
expect = "Rb4+"
reply = "Kf5"

[[steps]]
text = "Alttaki kale bir üst yataya, 5. yataya çıkıp şah çeker."
expect = "Ra5+"
reply = "Kg6"

[[steps]]
text = "Merdiveni sürdür: 6. yatay."
expect = "Rb6+"
reply = "Kh7"

[[steps]]
text = "7. yatay."
expect = "Ra7+"
reply = "Kg8"

[[steps]]
text = "Son basamak: 8. yatayda mat."
expect = "Rb8#"
success = "Merdiven matı!"

[[steps]]
text = "İpucu: şah kalelerinden birine yaklaşıp onu almakla tehdit ederse, o kaleyi aynı yatayda tahtanın öbür ucuna kaçır ve merdivene devam et. Kaleler birbirine engel olmasın diye farklı dikeylerde dursunlar."
