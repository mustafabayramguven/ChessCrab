name: Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "crates/**"
      - "android/**"
      - "Cargo.*"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android

      - name: cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Rust çekirdeğini Android için derle
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 --platform 26 \
            -o android/app/src/main/jniLibs build --release -p chesscrab-ffi

      - name: Kotlin bağlarını üret (UniFFI)
        run: |
          cargo run --release -p chesscrab-ffi --features cli --bin uniffi-bindgen -- \
            generate --library target/aarch64-linux-android/release/libchesscrab_ffi.so \
            --language kotlin --out-dir android/app/src/main/java --no-format

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Kotlin ↔ Rust testleri + ekran görüntüleri (Robolectric)
        run: |
          cargo build --release -p chesscrab-ffi
          CRAB_LIB_DIR="$GITHUB_WORKSPACE/target/release" gradle -p android recordRoborazziDebug --no-daemon --stacktrace

      - name: Ekran görüntülerini "screenshots" dalına koy
        if: always()
        run: |
          mkdir -p /tmp/shots
          cp android/app/build/screens/*.png /tmp/shots/ 2>/dev/null || true
          cp -r android/app/build/reports/tests /tmp/shots/test-raporu 2>/dev/null || true
          cd /tmp/shots
          git init -q && git checkout -q -b screenshots
          git add -A && git -c user.name=ci -c user.email=ci@chesscrab commit -qm "Ekran görüntüleri ${GITHUB_SHA::7}" || exit 0
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" screenshots

      - name: APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || format('0.1.{0}', github.run_number) }}
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: APK'yı yeniden adlandır
        run: cp android/app/build/outputs/apk/release/app-release.apk ChessCrab.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ChessCrab-apk
          path: ChessCrab.apk

      - name: Sürüm yayınla
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ChessCrab.apk
