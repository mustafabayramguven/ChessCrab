name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Derle
        run: cargo build --workspace --all-targets
      - name: Test (ders içeriği motorla doğrulanır)
        run: cargo test --workspace --release
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings -A clippy::needless_range_loop -A clippy::if_same_then_else -A clippy::too_many_arguments -A clippy::large_enum_variant

  docker:
    needs: rust
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: İmajı derle ve yayınla (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/mustafabayramguven/chesscrab:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
