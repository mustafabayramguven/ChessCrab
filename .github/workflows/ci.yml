name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Derle
        run: cargo build --workspace --all-targets
      - name: Test (ders içeriği motorla doğrulanır)
        run: cargo test --workspace --release
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings -A clippy::needless_range_loop -A clippy::if_same_then_else -A clippy::too_many_arguments -A clippy::large_enum_variant

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: web
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.130
      - name: WASM web uygulaması
        run: |
          cargo build --release -p chesscrab-wasm --target wasm32-unknown-unknown
          wasm-bindgen --target web --out-dir web/pkg target/wasm32-unknown-unknown/release/chesscrab_wasm.wasm
          ls -la web/pkg
      - name: Senkronizasyon sunucusu
        run: cargo build --release -p chesscrab-server
      - name: Tarayıcı testi (Playwright)
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          CHESSCRAB_DB=/tmp/cc/c.db CHESSCRAB_WEB_DIR=web CHESSCRAB_ADDR=127.0.0.1:3437 ./target/release/chesscrab-server &
          sleep 2
          SHOTS=shots python tests/web_e2e.py http://127.0.0.1:3437
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-ekran-goruntuleri
          path: shots

  docker:
    needs: [rust, web]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: İmajı derle ve yayınla (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/mustafabayramguven/chesscrab:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
